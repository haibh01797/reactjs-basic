name: React Auto Deploy (Self Hosted)

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Lấy source code mới nhất từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 3️⃣ Build image (KHÔNG cache để đảm bảo UI đổi)
      - name: Build Docker image
        run: |
          docker build --no-cache -t hailh123/reactjs-basic:latest .

      # 4️⃣ Push image lên Docker Hub
      - name: Push Docker image
        run: |
          docker push hailh123/reactjs-basic:latest

      # 5️⃣ Deploy container (docker thuần, không SSH)
      - name: Deploy container
        run: |
          docker stop reactjs-container || true
          docker rm reactjs-container || true
          docker run -d \
            --restart unless-stopped \
            -p 3000:80 \
            --name reactjs-container \
            hailh123/reactjs-basic:latest

